<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form</title>
  <link rel="stylesheet" href="T1.css" />
</head>
<body>

  <div class="container">
    <form id="regForm">
      <h2>Registration Form</h2>

      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your name" required />

      <label>Contact Number</label>
      <input type="tel" id="mobile" placeholder="Enter your Mobile No" required />

      <label>Father's Name</label>
      <input type="text" id="fatherName" placeholder="Enter your father's name" required />

      <label>Mother's Name</label>
      <input type="text" id="motherName" placeholder="Enter your mother's name" required />

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required />

      <label>Gender</label>
      <div class="radio-group">
        <input type="radio" name="gender" value="Male" /> Male
        <input type="radio" name="gender" value="Female" /> Female
      </div>

      <label>
        <input type="checkbox" id="terms" />
        I agree to the terms and conditions
      </label>

      <button type="submit">Register</button>
      <button type="reset">Reset</button>

      <p id="message"></p>
    </form>
  </div>

  <script src="T1.js"></script>
</body>
</html>
